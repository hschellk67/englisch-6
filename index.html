<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Englisch 6">
<meta name="theme-color" content="#1e1b4b">
<title>Englisch 6: Vokabeln & Grammatik</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f6f6f9; --text:#0f172a; --muted:#64748b; --line:rgba(15,23,42,.09);
  --ok:#059669; --okbg:#ecfdf5; --okline:#a7f3d0;
  --bad:#e11d48; --badbg:#fff1f2; --badline:#fecdd3;
  --warn:#b45309; --warnbg:#fffbeb; --warnline:#fde68a;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 28px rgba(15,23,42,.07);
  --bar:rgba(255,255,255,.78);
  --mc:#4f46e5;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --text:#f5f5f7; --muted:#a1a1aa; --line:rgba(255,255,255,.1);
    --ok:#34d399; --okbg:rgba(16,185,129,.14); --okline:rgba(52,211,153,.35);
    --bad:#fb7185; --badbg:rgba(244,63,94,.14); --badline:rgba(251,113,133,.35);
    --warn:#fbbf24; --warnbg:rgba(245,158,11,.13); --warnline:rgba(251,191,36,.35);
    --shadow:0 0 0 1px rgba(255,255,255,.06);
    --bar:rgba(28,28,30,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input{font:inherit;font-size:17px;color:var(--text)}
.ico{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
.wrap{max-width:900px;margin:0 auto;padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar))}
.hide{display:none!important}
.muted{color:var(--muted)}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);padding-top:var(--sat)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.logo{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;
  background:linear-gradient(135deg,#4338ca,#7c3aed);box-shadow:0 4px 12px rgba(79,70,229,.35)}
.brand h1{font-size:17px;margin:0;line-height:1.15;letter-spacing:-.01em}
.brand p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px}
.pill .f{color:#f59e0b}.pill .s{color:#10b981}

main{padding-top:18px;padding-bottom:calc(96px + var(--sab))}
body.in-game main{padding-bottom:calc(32px + var(--sab))}
.view{display:none}
.view.on{display:block;animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:16px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 22px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#7c3aed 0%,#4338ca 45%,#1e1b4b 100%);box-shadow:0 12px 32px rgba(49,46,129,.3)}
.hero .deco{position:absolute;right:-18px;top:-22px;font-size:120px;font-weight:900;opacity:.09;letter-spacing:-.05em;line-height:1;pointer-events:none}
.hero .eyebrow{color:#fff;display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:rgba(255,255,255,.15);padding:5px 10px;border-radius:999px}
.hero h2{font-size:clamp(24px,5.5vw,34px);line-height:1.12;margin:12px 0 8px;letter-spacing:-.02em;max-width:560px;position:relative}
.hero p{margin:0;color:rgba(255,255,255,.82);max-width:540px;position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;position:relative}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12px;color:rgba(255,255,255,.75)}
.meter{height:6px;border-radius:9px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:#34d399;border-radius:9px;transition:width .4s}
.herobtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;position:relative}
.hbtn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:15px;background:#fff;color:#312e81}
.hbtn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22)}
.hbtn:active{transform:scale(.97)}

.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--warnbg);border:1px solid var(--warnline)}
.banner .bi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#f59e0b;color:#fff;flex:none}
.banner h3{margin:0;font-size:15px}
.banner p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.banner .grow{flex:1;min-width:0}
.btn-sm{padding:10px 14px;border-radius:12px;background:#d97706;color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.btn-sm:active{transform:scale(.96)}

.sec-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 4px 10px}
.modes{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.modes{grid-template-columns:1fr 1fr}}
.mode{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;padding:18px;border-radius:22px;background:var(--card);box-shadow:var(--shadow)}
.mode .head{display:flex;gap:14px;align-items:flex-start}
.mode .mi{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;flex:none;font-size:22px;
  color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,transparent)}
.mode h3{margin:0 0 3px;font-size:17px;letter-spacing:-.01em}
.mode p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.mode .bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.mode .bar i{display:block;height:100%;background:var(--mc);border-radius:9px;transition:width .4s}
.mode .row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--mc)}
.mode .btns{display:flex;gap:8px}
.mbtn{flex:1;height:46px;border-radius:14px;background:var(--mc);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.mbtn.sec{flex:none;width:46px;background:color-mix(in srgb,var(--mc) 12%,transparent);color:var(--mc)}
.mbtn:active{transform:scale(.97)}
.rec{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:#f59e0b;color:#fff;margin-left:6px;vertical-align:2px}

.plan{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px}
.plan h3{margin:0 0 4px;font-size:16px}
.plan ol{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.plan li{margin:3px 0}
.plan li b{color:var(--text)}
.foot{margin:28px 4px 0;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{color:var(--muted);text-decoration:underline;font-size:12.5px}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar .wrap{display:flex;justify-content:space-around;height:62px;max-width:560px}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab .ico{width:24px;height:24px}
.tab.on{color:#4f46e5}
@media (prefers-color-scheme:dark){.tab.on{color:#a5b4fc}}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
body.in-game .tabbar{display:none}

/* Game */
.gbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.key{height:52px;min-width:52px;padding:0 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:19px;display:grid;place-items:center}
.key:active{transform:scale(.95)}
.prog{flex:1}
.prog .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.prog .row b{color:var(--mc)}
.track{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--mc);transition:width .35s}
.gcard{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px 18px}
@media (min-width:640px){.gcard{padding:30px}}
.chiprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  padding:5px 10px;border-radius:9px;color:var(--mc);background:color-mix(in srgb,var(--mc) 12%,transparent)}
.rulebtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--mc);padding:6px 10px;border-radius:10px}
.rulebtn:active{background:color-mix(in srgb,var(--mc) 10%,transparent)}
.instr{color:var(--muted);font-size:15px;margin:12px 0 14px}
.sentence{background:var(--card2);border-radius:18px;padding:20px 18px;font-size:clamp(19px,4.6vw,23px);line-height:1.9;font-weight:500}
.blank{display:inline-block;width:9.5em;max-width:100%;margin:0 4px;padding:3px 10px;text-align:center;font-weight:700;color:var(--mc);
  background:var(--card);border:2px solid color-mix(in srgb,var(--mc) 40%,transparent);border-radius:12px;outline:none;vertical-align:baseline;line-height:1.5}
.blank.s{width:5.5em}
.blank.l{width:12em}
.inp{width:100%;min-width:0;height:54px;padding:0 16px;border-radius:15px;border:2px solid color-mix(in srgb,var(--mc) 40%,transparent);background:var(--card);font-weight:700;outline:none;margin-top:12px;color:var(--mc)}
.blank:focus,.inp:focus{border-color:var(--mc);box-shadow:0 0 0 4px color-mix(in srgb,var(--mc) 18%,transparent)}
.blank:disabled,.inp:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.is-ok{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important}
.is-bad{border-color:var(--bad)!important;background:var(--badbg)!important;color:var(--bad)!important}
.is-warn{border-color:#f59e0b!important;background:var(--warnbg)!important}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hintline{font-size:13px;color:var(--muted);margin-top:10px}

.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:56px;padding:12px 14px;border-radius:16px;background:var(--card2);border:2px solid var(--line);font-weight:600;font-size:16.5px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:transform .12s}
.opts.two .opt{justify-content:center;text-align:center;font-weight:700;font-size:17px}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 10%,transparent);color:var(--mc)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.5}

.zone{min-height:66px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:18px;border:2px dashed color-mix(in srgb,var(--mc) 40%,transparent);background:color-mix(in srgb,var(--mc) 5%,transparent)}
.zone .ph{font-size:14px;color:var(--muted);padding:0 4px}
.zone.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.zone.bad{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:50px}
.tile{padding:9px 13px;border-radius:13px;background:var(--card);border:2px solid var(--line);font-size:clamp(17px,4.2vw,20px);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tile:active{transform:scale(.95)}
.zone .tile{background:var(--mc);border-color:var(--mc);color:#fff}

.fb{display:none;margin-top:18px;padding:14px 16px;border-radius:18px;border:1px solid}
.fb.on{display:flex;gap:12px;animation:in .22s}
.fb .fi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.fb h4{margin:3px 0 2px;font-size:16px}
.fb p{margin:4px 0 0;font-size:14.5px;line-height:1.5}
.fb.ok{background:var(--okbg);border-color:var(--okline)}.fb.ok .fi{background:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--badline)}.fb.bad .fi{background:var(--bad)}
.fb.warn{background:var(--warnbg);border-color:var(--warnline)}.fb.warn .fi{background:#f59e0b}
.sol{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:10px;background:var(--card);font-weight:700;font-size:15px}

.actions{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.btn{flex:1;height:52px;border-radius:16px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;background:var(--mc);
  box-shadow:0 6px 18px color-mix(in srgb,var(--mc) 30%,transparent)}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none}
.btn.dark{background:var(--text);color:var(--bg);box-shadow:none}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.rose{background:#e11d48;--mc:#e11d48}
.btn.auto{flex:none;padding:0 18px}

/* Summary */
.sum{text-align:center}
.trophy{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;margin:4px auto 12px;font-size:34px;color:#fff;background:linear-gradient(135deg,#f59e0b,#ef4444)}
.sum h2{margin:0;font-size:28px;letter-spacing:-.02em}
.sum .sub{color:var(--muted);margin:6px 0 18px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:460px;margin:0 auto 18px}
.sgrid div{background:var(--card2);border-radius:16px;padding:12px 6px}
.sgrid small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sgrid b{font-size:22px}
.mlist{text-align:left;background:var(--warnbg);border:1px solid var(--warnline);border-radius:18px;padding:14px;margin-bottom:16px}
.mlist h3{margin:0 0 4px;font-size:15px}
.mitem{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.mitem .q{color:var(--muted);font-size:13.5px}
.mitem .a{font-weight:700;color:var(--ok)}
.sumbtns{display:flex;flex-wrap:wrap;gap:10px}
.sumbtns .btn{min-width:180px}

/* Cheat sheet */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:9px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--text);color:var(--bg)}
.cs{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px 18px;border-top:5px solid var(--mc)}
.cs h3{margin:0;font-size:19px;letter-spacing:-.01em}
.cs .subt{margin:2px 0 0;color:var(--muted);font-size:14px}
.cs .cols{display:grid;gap:16px;margin-top:16px}
@media (min-width:700px){.cs .cols{grid-template-columns:1fr 1fr}}
.cs h4{margin:0 0 8px;font-size:14px;color:var(--mc);text-transform:uppercase;letter-spacing:.04em}
.cs ul{list-style:none;margin:0;padding:0}
.cs li{position:relative;padding-left:20px;margin:7px 0;font-size:15px;line-height:1.5}
.cs li:before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--mc)}
.cs code,.fb code,.mitem code{font-family:inherit;font-weight:700;background:color-mix(in srgb,var(--mc) 10%,transparent);color:var(--mc);padding:1px 6px;border-radius:6px}
.formula{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--mc) 9%,transparent);font-weight:700;font-size:16px;text-align:center;color:var(--mc)}
.pit{margin-top:16px;display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:var(--warnbg);border:1px solid var(--warnline);font-size:14.5px}
.pit .ico{color:#d97706;width:22px;height:22px;margin-top:1px}
.cs .go{margin-top:16px}

/* Exam */
.examhead{text-align:center}
.examhead .ei{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;margin:4px auto 12px;color:#fff;background:linear-gradient(135deg,#4338ca,#7c3aed)}
.examhead .ei .ico{width:36px;height:36px}
.examhead h2{margin:0;font-size:26px;letter-spacing:-.02em}
.examhead p{color:var(--muted);max-width:520px;margin:8px auto 18px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:0 auto 20px}
.rules div{background:var(--card2);border-radius:16px;padding:12px 6px;text-align:center}
.rules b{display:block;font-size:20px}
.rules small{font-size:12px;color:var(--muted);font-weight:600}
.ebar{position:sticky;top:calc(61px + var(--sat));z-index:15;display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:14px;border-radius:18px;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;padding:8px 12px;border-radius:12px;background:var(--card2);display:flex;align-items:center;gap:6px}
.timer.low{background:var(--badbg);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.eq{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
.eq .n{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.eq .n span:last-child{color:var(--mc)}
.eq .instr{margin:0 0 10px;font-size:14px}
.eq .sentence{font-size:clamp(17px,4.2vw,20px);padding:14px}
.eq .opts{margin-top:12px}
.eq.done{border-left:5px solid var(--mc)}
.grade{font-size:84px;font-weight:900;line-height:1;letter-spacing:-.04em;margin:6px 0 2px;background:linear-gradient(135deg,#4338ca,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.tbreak{display:grid;gap:10px;max-width:520px;margin:0 auto 18px;text-align:left}
.tb{background:var(--card2);border-radius:14px;padding:10px 12px}
.tb .row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.tb .bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.tb .bar i{display:block;height:100%;background:var(--mc);border-radius:9px}
.corr{border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid;font-size:14.5px}
.corr.ok{background:var(--okbg);border-color:var(--okline)}
.corr.bad{background:var(--badbg);border-color:var(--badline)}
.corr .q{font-weight:600}
.corr .you{margin-top:6px}
.corr .ex{margin-top:6px;color:var(--muted);font-size:13.5px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

/* Review list */
.empty{text-align:center;padding:30px 20px;background:var(--card);border-radius:26px;box-shadow:var(--shadow)}
.empty .ei{width:64px;height:64px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;background:var(--okbg);color:var(--ok)}
.empty .ei .ico{width:32px;height:32px}
.empty h2{margin:0 0 6px;font-size:22px}
.empty p{color:var(--muted);margin:0 0 16px}

/* Sheet / modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:640px;max-height:86vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(20px + var(--sab));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px)}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px;padding-bottom:20px}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet .shead h3{margin:0;font-size:18px}
.close{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card)}
.dlg{padding:6px 4px}
.dlg h3{margin:0 0 6px;font-size:20px}
.dlg p{margin:0 0 18px;color:var(--muted)}
.dlg .actions{border:0;padding:0;margin:0}

.toast{position:fixed;left:50%;top:calc(72px + var(--sat));transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none}
.toast.on{display:block;animation:in .25s}

/* Tagesplan */
.today{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px}
.today h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.titem{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.titem:first-of-type{border-top:0}
.tcheck{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line);color:transparent}
.tcheck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.titem .grow{flex:1;min-width:0}
.titem b{display:block;font-size:15px}
.titem small{color:var(--muted);font-size:13px}
.titem .mini{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.titem .mini i{display:block;height:100%;background:var(--ok);border-radius:9px}
.tgo{padding:9px 13px;border-radius:12px;font-weight:700;font-size:14px;color:#fff;background:var(--mc,#4f46e5);white-space:nowrap}
.tgo:active{transform:scale(.96)}
.unitsel{margin-top:12px;position:relative;font:inherit;font-size:14px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 10px}
.unitsel option{color:#000}

/* Vokabeln */
.vstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vstat{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px}
.vstat b{display:block;font-size:24px;line-height:1.1}
.vstat span{font-size:12.5px;color:var(--muted);font-weight:600}
.vstat.ok b{color:var(--ok)}.vstat.pr b{color:#d97706}
.ring{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px}
.ring svg{width:56px;height:56px;flex:none;transform:rotate(-90deg)}
.ring .grow{flex:1}
.ring h3{margin:0;font-size:16px}
.ring p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.chips button.on{background:var(--text);color:var(--bg)}
.chips button small{font-size:11px;opacity:.7}
.chips button.weak.on{background:var(--bad);color:#fff}
.vprompt{text-align:center;background:var(--card2);border-radius:20px;padding:26px 16px 22px}
.vprompt .lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vprompt .word{font-size:clamp(28px,7.5vw,40px);font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.15}
.vprompt .also{font-size:14px;color:var(--muted)}
.vprompt .reveal{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.vprompt .reveal .word{font-size:clamp(22px,6vw,30px);color:var(--mc)}
.spk{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);color:var(--mc);box-shadow:var(--shadow);vertical-align:middle;margin-left:6px}
.spk:active{transform:scale(.92)}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.hintbtn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#b45309;padding:8px 12px;border-radius:12px;background:var(--warnbg);border:1px solid var(--warnline);margin-top:12px}
.hintline{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.12em;margin-left:8px;color:var(--text)}
.diff{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700;letter-spacing:.04em;margin-top:6px;background:var(--card);border-radius:10px;padding:6px 10px;display:inline-block}
.diff mark{background:var(--bad);color:#fff;border-radius:4px;padding:0 2px}
.vlist{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.vrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .st{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.vrow .st.pr{background:#f59e0b}.vrow .st.ok{background:var(--ok)}
.vrow .grow{flex:1;min-width:0}
.vrow b{font-size:15.5px}
.vrow .de{color:var(--muted);font-size:14px}
.vrow .tp{font-size:12.5px;color:var(--muted);opacity:.85}
.vrow .spk{width:34px;height:34px;box-shadow:none;background:var(--card2)}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:none;box-shadow:var(--shadow);font-weight:600}
.search:focus{border-color:#4f46e5}
.more{display:block;width:100%;padding:12px;font-weight:700;color:#4f46e5;border-top:1px solid var(--line)}
.rate{display:flex;gap:10px;margin-top:16px}
.btn.okb{background:var(--ok);box-shadow:0 6px 18px color-mix(in srgb,var(--ok) 30%,transparent)}
.btn.badb{background:var(--bad);box-shadow:0 6px 18px color-mix(in srgb,var(--bad) 30%,transparent)}
.confetti{position:fixed;left:50%;top:35%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;white-space:nowrap;font-size:22px;font-weight:800;padding:14px 22px;border-radius:999px;background:var(--text);color:var(--bg);box-shadow:0 12px 32px rgba(0,0,0,.25);animation:pop 1.2s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
</style>
</head>

<script>

};

function paintIcons(root){(root||document).querySelectorAll('[data-i]').forEach(el=>{el.innerHTML=ico(el.dataset.i);el.removeAttribute('data-i')})}

/* =========================================================================
   INHALT: THEMEN & SPICKZETTEL

const TOPICS=[
  {id:'going-to',name:'going to-future',short:'Pläne, Anzeichen & Short Answers',icon:'spark',color:'#4f46e5'},

];
const T=id=>id==='vocab'?VT:TOPICS.find(t=>t.id===id);

const CHEAT={
 'going-to':{
   title:'going to-future',sub:'Pläne & sichtbare Anzeichen in der Zukunft',
   formula:'am / is / are + going to + Infinitiv',
   cols:[
    {h:'Wann benutzt man es?',p:[
      'Für <b>feste Pläne und Absichten</b>: <code>I\'m going to watch</code> the latest action movie.',

 },
 'question-tags':{
   title:'Question tags',sub:'„…, oder?“ / „…, nicht wahr?“',

   cols:[

      'Satz <b>positiv</b> → Tag <b>negativ</b>: Jack is next to you, <code>isn\'t he?</code>',

 },
 'prepositions':{

 },
 'comparison-numbers':{
   title:'Comparison & Numbers',sub:'Steigerung, Zahlen & Jahreszahlen',

 }
};

/* =========================================================================
   FRAGENBANK
   type: gap (Lücken im Satz, ___ = Lücke) | write (freie Antwort) | mc | order
   a: akzeptierte Antworten (pro Lücke ein Array), show: angezeigte Lösung
   trap: [{a:[...],m:'gezielte Rückmeldung'}] typische Fehler
   ========================================================================= */
const Q_RAW=[
 // ---------- going to-future ----------

   AUSWERTUNG
   ========================================================================= */
function norm(s){
  return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”„]/g,'"')
    .replace(/^["\s]+|["\s]+$/g,'').replace(/\s+/g,' ').replace(/\s+([?.!,])/g,'$1').replace(/[.!]+$/,'').trim();
}
function noQ(s){return s.replace(/\?$/,'').trim()}
function eq(u,a){u=norm(u);a=norm(a);return u===a||noQ(u)===noQ(a)}
function lev(a,b){
  const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;
  const d=Array.from({length:m+1},(_,i)=>{const r=Array(n+1).fill(0);r[0]=i;return r});for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}
  return d[m][n];
}
/* Ergebnis: {r:'ok'|'near'|'trap'|'bad', m:msg} */
function evaluate(q,ans){
  if(q.type==='vocab'){const r=vEval(q.v,ans);return {r:r.r==='ok'||r.r==='alt'?'ok':r.r}}
  if(q.type==='mc')return {r:ans===q.c?'ok':'bad'};
  if(q.type==='order')return {r:norm(ans)===norm(q.c)?'ok':'bad'};
  const arr=Array.isArray(ans)?ans:[ans];
  let allOk=true,near=null;
  for(let k=0;k<q.a.length;k++){
    const u=arr[k]||'';
    if(q.a[k].some(a=>eq(u,a)))continue;
    if(q.a.length===1&&q.type==='gap'){ // Subjekt mitgeschrieben? ("It's going to rain")
      const lw=(q.s.split('___')[0].trim().split(' ').pop()||'').replace(/^["“]/,'');
      if(lw&&q.a[0].some(a=>eq(u,lw+a)||eq(u,lw+' '+a))){arr[0]=u;continue}
    }
    allOk=false;
    if(!near){
      const nu=noQ(norm(u));
      for(const a of q.a[k]){
        const na=noQ(norm(a));
        if(nu.replace(/'/g,'')===na.replace(/'/g,'')&&nu){near='Fast! Da fehlt ein Apostroph (\').';break}
        if(na.length>=4&&nu&&lev(nu,na)===1){near='Fast! Prüfe die Schreibweise noch einmal.';break}
      }
    }
  }
  if(allOk)return {r:'ok'};
  if(q.trap&&q.a.length===1){
    for(const t of q.trap)if(t.a.some(a=>eq(arr[0]||'',a)))return {r:'trap',m:t.m};
  }
  if(near)return {r:'near',m:near};
  return {r:'bad'};
}
function solutionText(q){
  if(q.type==='vocab')return q.v.en.join(' / ');
  if(q.type==='mc')return q.c;
  if(q.type==='order')return q.c;
  return q.show;
}
function fullSentence(q){
  if(q.type==='gap'){
    let k=0;const out=q.s.replace(/___/g,()=>{const v=q.a.length===1?q.show:q.a[k][0];k++;return v}).replace(/\s\(([^)]*)\)/g,'').replace(/ '/g,"'");
    return out.charAt(0).toUpperCase()+out.slice(1);
  }
  return '';
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function daysLeft(){const t=new Date();t.setHours(0,0,0,0);return Math.round((UNIT.exam-t)/864e5)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1800)}
function topicStats(id){const qs=Q.filter(q=>q.t===id);const m=qs.filter(q=>S.mastered.includes(q.id)).length;return {n:qs.length,m,pct:Math.round(m/qs.length*100)}}
function weakestTopic(){
  return TOPICS.map(t=>{const st=topicStats(t.id);const miss=Q.filter(q=>q.t===t.id&&S.missed.includes(q.id)).length;return {t,score:st.pct-miss*8}}).sort((a,b)=>a.score-b.score)[0].t;
}

let G=null;
function startTopic(id){
  const qs=Q.filter(q=>q.t===id);
  const un=shuffle(qs.filter(q=>!S.mastered.includes(q.id)||S.missed.includes(q.id)));
  const ma=shuffle(qs.filter(q=>S.mastered.includes(q.id)&&!S.missed.includes(q.id)));
  startSession([...un,...ma].slice(0,10),{label:T(id).name,kind:'topic',topic:id});
}
function startReview(){
  const qs=shuffle(Q.filter(q=>S.missed.includes(q.id)));
  if(!qs.length){go('review');return}
  startSession(qs.slice(0,15),{label:'Fehler-Wiederholung',kind:'review'});
}
function startSession(list,meta){
  G={list,meta,idx:0,score:0,xp:0,wrong:[],tries:0,done:false,tiles:null};
  go('game');renderQ();
}
function leaveGame(){
  if(G&&G.idx>0&&!G.finished){confirmDlg('Runde beenden?','Was Du schon geübt hast, bleibt gespeichert.','Beenden',()=>go(G.mode?'vocab':'home'),'Weiterüben');return}
  go(G&&G.mode?'vocab':'home');
}
function renderQ(){
  if(G.mode){renderVQ();return}
  const q=G.list[G.idx],t=T(q.t);G.tries=0;G.done=false;
  const v=$('#v-game');v.style.setProperty('--mc',t.color);
  let body='';
  if(q.type==='gap'){
    let k=0;
    const s=esc(q.s).replace(/___/g,()=>{const sz=(q.sz&&q.sz[k])||'';return `<input class="blank ${sz}" data-k="${k++}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Lücke">`});
    body=`<div class="sentence">${s}</div>`;
  }else if(q.type==='write'){
    body=`<div class="sentence">${esc(q.s)}</div><input class="inp" data-k="0" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Auf Englisch …">`;
  }else if(q.type==='mc'){
    body=(q.s?`<div class="sentence">${esc(q.s)}</div>`:'')+`<div class="opts ${q.two?'two':''}">${shuffle(q.o).map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }else if(q.type==='order'){
    G.pool=shuffle(q.w.map((w,i)=>({i,w})));
    if(G.pool.map(x=>x.w).join(' ')===q.c&&q.w.length>2)G.pool.push(G.pool.shift());
    G.zone=[];
    body=`<div class="zone" id="zone"></div><div class="pool" id="pool"></div>`;
  }
  const typed=q.type==='gap'||q.type==='write',ord=q.type==='order';
  v.innerHTML=`<div class="gbar"><button class="key" id="gBack" aria-label="Zurück">${ico('left')}</button>
    <div class="prog"><div class="row"><span>${esc(G.meta.label)}</span><span><b>${G.idx+1}</b> / ${G.list.length}</span></div><div class="track"><i style="width:${G.idx/G.list.length*100}%"></i></div></div></div>
    <div class="gcard">
      <div class="chiprow"><span class="chip">${ico(t.icon)} ${t.name}</span><button class="rulebtn" id="gRule">${ico('book')} Regel</button></div>
      <p class="instr">${esc(q.i)}</p>
      ${body}
      <div class="fb" id="fb"></div>
      <div class="actions" id="acts">
        ${ord?`<button class="btn ghost auto" id="gReset">${ico('rotate')}</button>`:''}
        ${typed||ord?`<button class="btn" id="gCheck" ${ord?'disabled':''}>Prüfen</button>`:''}
        <button class="btn dark hide" id="gNext">${G.idx+1<G.list.length?'Weiter':'Ergebnis'} ${ico('right')}</button>
      </div>
    </div>`;
  if(q.type==='mc'&&!typed){$('#acts').classList.add('hide')}
  $('#gBack').onclick=leaveGame;
  $('#gRule').onclick=()=>showRule(q.t);
  $('#gNext').onclick=next;
  if(typed){
    const ins=[...v.querySelectorAll('[data-k]')];
    ins.forEach((el,i)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(G.done){next();return}if(i<ins.length-1&&!ins[i+1].value)ins[i+1].focus();else check()}}));
    $('#gCheck').onclick=check;
    setTimeout(()=>{if(matchMedia('(hover:hover)').matches)ins[0].focus()},50);
  }
  if(q.type==='mc')v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>checkMC(b));
  if(ord){drawTiles();$('#gReset').onclick=()=>{G.pool=[...G.pool,...G.zone];G.zone=[];drawTiles()};$('#gCheck').onclick=check}
}
function drawTiles(){
  const z=$('#zone'),p=$('#pool');
  z.innerHTML=G.zone.length?G.zone.map((x,i)=>`<button class="tile" data-z="${i}">${esc(x.w)}</button>`).join(''):'<span class="ph">Tippe die Wörter in der richtigen Reihenfolge an …</span>';
  p.innerHTML=G.pool.map((x,i)=>`<button class="tile" data-p="${i}">${esc(x.w)}</button>`).join('');
  z.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{if(G.done)return;G.pool.push(...G.zone.splice(+b.dataset.z,1));drawTiles()});
  p.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(G.done)return;G.zone.push(...G.pool.splice(+b.dataset.p,1));drawTiles()});
  $('#gCheck').disabled=G.pool.length>0;
}
function checkMC(btn){
  if(G.done)return;
  const q=G.list[G.idx],ans=btn.dataset.o,res=evaluate(q,ans);
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.o===q.c)b.classList.add('right');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim')});
  finish(q,res,ans);
}
function check(){
  if(G.done)return;
  const q=G.list[G.idx];let ans,els=[];
  if(q.type==='order'){ans=G.zone.map(x=>x.w).join(' ')}
  else{els=[...document.querySelectorAll('#v-game [data-k]')];ans=els.map(e=>e.value);if(ans.every(a=>!a.trim())){els[0].classList.add('shake');setTimeout(()=>els[0].classList.remove('shake'),400);els[0].focus();return}}
  const res=evaluate(q,ans);
  if(res.r==='near'&&G.tries===0){
    G.tries++;
    els.forEach((el,k)=>{if(!q.a[k].some(a=>eq(el.value,a))){el.classList.add('is-warn','shake');setTimeout(()=>el.classList.remove('shake'),400)}});
    showFb('warn',res.m,'Du hast noch einen Versuch.','');
    const f=els.find(e=>e.classList.contains('is-warn'));if(f)f.focus();
    return;
  }
  if(q.type==='order'){$('#zone').classList.add(res.r==='ok'?'ok':'bad');$('#gReset').classList.add('hide')}
  els.forEach((el,k)=>{el.disabled=true;el.classList.remove('is-warn');el.classList.add(res.r==='ok'||q.a[k].some(a=>eq(el.value,a))?'is-ok':'is-bad')});
  finish(q,res,ans);
}
function showFb(kind,title,text,sol){
  const fb=$('#fb');fb.className='fb on '+kind;
  fb.innerHTML=`<div class="fi">${ico(kind==='ok'?'check':kind==='bad'?'x':'alert')}</div><div><h4>${title}</h4>${sol?`<div class="sol">${sol}</div>`:''}${text?`<p>${text}</p>`:''}</div>`;
}
function finish(q,res,ans){
  G.done=true;
  const ok=res.r==='ok';
  if(ok){
    G.score++;streak++;const gain=10+Math.min(streak-1,5);G.xp+=gain;S.xp+=gain;
    if(!S.mastered.includes(q.id))S.mastered.push(q.id);
    const wasMissed=S.missed.includes(q.id);S.missed=S.missed.filter(x=>x!==q.id);
    const praise=['Richtig!','Genau so!','Perfekt!','Stark!','Sitzt!'][Math.floor(Math.random()*5)];
    showFb('ok',praise+(wasMissed?' Fehler geknackt.':''),q.ex,'');
  }else{
    streak=0;
    if(!S.missed.includes(q.id))S.missed.push(q.id);
    G.wrong.push({q,ans});
    showFb('bad',res.r==='trap'?'Typischer Fehler':'Leider falsch',(res.m?res.m+'<br>':'')+q.ex,'Richtig: '+esc(q.type==='gap'?fullSentence(q):solutionText(q)));
  }
  save();updateHeader();
  $('#acts').classList.remove('hide');
  const c=$('#gCheck');if(c)c.classList.add('hide');
  const n=$('#gNext');n.classList.remove('hide');
  if(!matchMedia('(hover:hover)').matches)$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  setTimeout(()=>n.focus({preventScroll:true}),30);
}
function next(){
  if(G.idx+1<G.list.length){G.idx++;renderQ();window.scrollTo({top:0})}
  else summary();
}
function summary(){
  G.finished=true;
  if(!G.mode){day().g++;save()}
  const n=G.list.length,p=Math.round(G.score/n*100);
  const n0=G.mode?G.score+G.wrong.length:n;const head=G.mode&&G.wrong.length===0?'Alles gewusst!':p===100?'Alles richtig!':p>=80?'Sehr gut gemacht!':p>=50?'Gute Runde!':'Dranbleiben lohnt sich!';
  const v=$('#v-game');v.style.setProperty('--mc','#4f46e5');
  v.innerHTML=`<div class="gcard sum">

/* =========================================================================
   VOKABEL-LOGIK (Lernkartei mit Boxen 0–3)
   ========================================================================= */
function vp(id){return S.vocab[id]||{b:0,s:0,w:0,t:0}}
function vStatus(id){const p=S.vocab[id];return !p||!p.s?'new':p.b>=3?'ok':'pr'}
function isWeak(id){const p=S.vocab[id];return !!p&&p.s>0&&p.b===0&&p.w>0}
function weakVocab(){return V.filter(v=>isWeak(v.id))}
function vStats(){let ok=0,pr=0,nw=0;V.forEach(v=>{const s=vStatus(v.id);if(s==='ok')ok++;else if(s==='pr')pr++;else nw++});return {ok,pr,nw,n:V.length}}
function vnorm(s){
  return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/…|\.\.\./g,' ').replace(/[.!?,;:]/g,' ')
    .replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ').trim().replace(/^to /,'').replace(/ (sb|somebody|sth|something)$/,'').trim();
}
function vEval(v,ans){
  const u=vnorm(ans);if(!u)return {r:'bad'};
  if(v.en.some(e=>vnorm(e)===u))return {r:'ok'};
  const prompt=v.de[0].toLowerCase();
  const alt=V_ALL.find(o=>o.id!==v.id&&o.de.some(d=>d.toLowerCase()===prompt)&&o.en.some(e=>vnorm(e)===u));
  if(alt)return {r:'alt',m:`„${esc(alt.en[0])}“ passt auch – gesucht ist hier aber ein anderes Wort.`};
  for(const e of v.en){const t=vnorm(e),L=t.replace(/[^a-z]/g,'').length;if(L>=3&&lev(u,t)<=(L>=7?2:1))return {r:'near',m:'Fast! Prüfe die Schreibweise noch einmal.'}}
  return {r:'bad'};
}
function vUpdate(id,ok,hinted){
  const p=Object.assign({b:0,s:0,w:0,t:0},S.vocab[id]);p.s++;p.t=Date.now();
  if(ok){if(!hinted)p.b=Math.min(3,p.b+1)}else{p.b=0;p.w++}
  S.vocab[id]=p;
}
function vWeight(v){
  const p=vp(v.id),box=Math.pow(.46,p.b),err=1+p.w*1.4+(p.b===0&&p.s>0?2.2:0),fair=p.s===0?2.5:1+1.5/(p.s+1);
  const mins=p.t?(Date.now()-p.t)/6e4:90,time=Math.min(2,.75+mins/15);
  return Math.max(.05,box*err*fair*time*(.8+Math.random()*.4));
}
function pickVocab(pool,n){
  pool=[...pool];const out=[];
  while(out.length<n&&pool.length){const w=pool.map(vWeight);let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;for(;i<w.length-1;i++){r-=w[i];if(r<=0)break}out.push(pool.splice(i,1)[0])}
  return out;
}
function speak(t){
  try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/…|\.\.\./g,'').replace(/\//g,' or '));u.lang='en-GB';u.rate=.92;speechSynthesis.speak(u)}catch(e){}
}
function celebrate(){const c=document.createElement('div');c.className='confetti';c.textContent=['🎉','🔥','⭐','🏆'][Math.floor(Math.random()*4)]+' '+streak+'er-Serie!';document.body.appendChild(c);setTimeout(()=>c.remove(),1300)}
function diffHtml(u,t){
  u=String(u||'').toLowerCase();const Tc=[...t],U=[...u],m=U.length,n=Tc.length;
  const L=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=U[i]===Tc[j].toLowerCase()?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const keep=new Set();let i=0,j=0;
  while(i<m&&j<n){if(U[i]===Tc[j].toLowerCase()){keep.add(j);i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  return '<span class="diff">'+Tc.map((c,k)=>keep.has(k)||c===' '?esc(c):`<mark>${esc(c)}</mark>`).join('')+'</span>';
}
function quizOptions(v,dir){
  const lab=x=>dir==='de-en'?x.en[0]:x.de[0],verb=x=>/^to /.test(x.en[0]),tl=lab(v);
  const others=V.filter(o=>o.id!==v.id&&lab(o)!==tl&&o.de[0]!==v.de[0]);
  const same=shuffle(others.filter(o=>o.cat===v.cat&&verb(o)===verb(v)));
  const rest=shuffle(others.filter(o=>!same.includes(o)));
  return shuffle([v,...[...same,...rest].slice(0,3)]).map(o=>({id:o.id,label:lab(o)}));
}
const PRAISE=['Richtig!','Genau so!','Perfekt!','Stark!','Sitzt!'];
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* Sitzungen */
let VF={cat:'all',weak:false},vSearch='',vSt='all',vAll=false;
function vPool(){return V.filter(v=>(VF.cat==='all'||v.cat===VF.cat)&&(!VF.weak||isWeak(v.id)))}
const VMODES={write:{label:'Vokabeln schreiben',dir:'de-en'},cards:{label:'Karteikarten',dir:'en-de'},quiz:{label:'Schnell-Quiz',dir:'mixed'}};
function startVocab(mode,poolOverride,label){

  G={mode:'v'+mode,list,idx:0,score:0,xp:0,wrong:[],req:new Set(),meta:{label:label||VMODES[mode].label,kind:'vocab',vmode:mode,pool:poolOverride}};

}

function hintText(w,lvl){

  return esc(w.slice(0,1))+[...w.slice(1)].map(c=>/[a-z]/i.test(c)?'_':c===' '?'  ':esc(c)).join(' ')+` <span class="muted" style="letter-spacing:0">(${w.replace(/[^a-z]/gi,'').length} Buchstaben)</span>`;
}

      <div class="reveal hide" id="vRev"><div class="word">${esc(v.de[0])}</div>${v.de.length>1?`<div class="also">auch: ${esc(v.de.slice(1).join(' · '))}</div>`:''}<div class="also" style="margin-top:6px">${ico('bulb')} ${esc(v.tip)}</div></div></div>

function vCheck(){
  if(G.done)return;
  const it=G.list[G.idx],inp=$('#vin'),ans=inp.value;
  if(!ans.trim()){inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);inp.focus();return}
  const res=vEval(it.v,ans);
  if((res.r==='near'||res.r==='alt')&&G.tries===0){
    G.tries++;inp.classList.add('is-warn','shake');setTimeout(()=>inp.classList.remove('shake'),400);
    showFb('warn',res.r==='alt'?'Auch ein englisches Wort dafür':'Fast!',res.r==='alt'?res.m+' Versuch es noch einmal.':'Prüfe die Schreibweise – Du hast noch einen Versuch.','');
    inp.focus();return;
  }
  finishV(res.r==='ok',res,ans);
}
function finishV(ok,res,ans){
  const it=G.list[G.idx],v=it.v;G.done=true;
  vUpdate(v.id,ok,G.mode==='vwrite'&&G.hint>0);
  if(ok){
    G.score++;streak++;const gain=(G.mode==='vquiz'?6:10)+Math.min(streak-1,5);G.xp+=gain;S.xp+=gain;day().v++;
    if(streak>0&&streak%5===0)celebrate();
  }else{
    streak=0;if(!G.wrong.some(w=>w.v.id===v.id))G.wrong.push(it);
    if(!G.req.has(v.id)){G.req.add(v.id);G.list.splice(Math.min(G.idx+4,G.list.length),0,{v,dir:it.dir,again:true})}
  }
  save();updateHeader();
  if(G.mode==='vcards'){next();return}
  if(G.mode==='vwrite'){
    const inp=$('#vin');inp.disabled=true;inp.classList.remove('is-warn');inp.classList.add(ok?'is-ok':'is-bad');
    if(ok)showFb('ok',G.hint?'Richtig – mit Tipp':pick(PRAISE),`${ico('bulb')} ${esc(v.tip)}`,esc(v.en.join(' · ')));
    else showFb('bad',res.r==='near'?'Knapp daneben':'Leider falsch',(res.r==='alt'?res.m+'<br>':'')+(ans&&ans.trim()?'Rot markiert: Hier lag der Fehler.<br>':'')+`${ico('bulb')} ${esc(v.tip)}`,'Richtig: '+diffHtml(ans,v.en[0])+(v.en.length>1?` <span class="muted" style="font-weight:600">(auch: ${esc(v.en.slice(1).filter(e=>!/^it is|^to |\.$/.test(e)).join(', '))})</span>`.replace(' (auch: )',''):''));
    speak(v.en[0]);
  }else{
    showFb(ok?'ok':'bad',ok?pick(PRAISE):'Leider falsch',`${ico('bulb')} ${esc(v.tip)}`,esc(v.en[0])+' = '+esc(v.de[0]));
    if(ok)speak(v.en[0]);
  }
  $('#acts').classList.remove('hide');const c=$('#gCheck');if(c)c.classList.add('hide');
  const n=$('#gNext');n.classList.remove('hide');
  if(!matchMedia('(hover:hover)').matches)$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  setTimeout(()=>n.focus({preventScroll:true}),30);
}

    <div class="actions" style="border:0;padding:0;margin:0;flex-wrap:wrap">
      ${wv.length?`<button class="btn" style="--mc:${VT.color};min-width:200px" id="rVoc">${ico('cards')} ${wv.length} ${wv.length===1?'Vokabel':'Vokabeln'} üben</button>`:''}
      ${S.missed.length?`<button class="btn rose" style="min-width:200px" id="rStart">${ico('brain')} ${S.missed.length} Grammatik-${S.missed.length===1?'Aufgabe':'Aufgaben'}</button>`:''}
    </div>
    ${wv.length?`<div class="cs" style="--mc:${VT.color};border-top-width:4px"><h3 style="font-size:16px">Vokabeln <span class="muted" style="font-weight:600">· ${wv.length}</span></h3>
      <ul style="margin-top:8px">${wv.map(x=>`<li>${esc(x.de[0])} → <b>${esc(x.en[0])}</b></li>`).join('')}</ul></div>`:''}
    ${by.map(x=>`<div class="cs" style="--mc:${x.t.color};border-top-width:4px"><h3 style="font-size:16px">${x.t.name} <span class="muted" style="font-weight:600">· ${x.qs.length}</span></h3>
      <ul style="margin-top:8px">${x.qs.map(q=>`<li>${esc(q.type==='gap'?fullSentence(q):q.type==='order'?q.c:(q.s?q.s+' → '+solutionText(q):solutionText(q)))}</li>`).join('')}</ul></div>`).join('')}
  </div>`;
  if($('#rStart'))$('#rStart').onclick=startReview;
  if($('#rVoc'))$('#rVoc').onclick=startVocabWeak;
}

/* =========================================================================
   PROBE-SCHULAUFGABE
   ========================================================================= */
const EX={running:false,qs:[],ans:{},timed:true,left:900,timer:null};
function grade(p){
  if(p>=92)return {g:1,l:'sehr gut',c:'Überragend – Du bist top vorbereitet!'};
  if(p>=80)return {g:2,l:'gut',c:'Klasse Leistung! Nur noch Kleinigkeiten feinschleifen.'};
  if(p>=65)return {g:3,l:'befriedigend',c:'Solide Basis. Schau Dir Deine Fehler noch einmal an.'};
  if(p>=50)return {g:4,l:'ausreichend',c:'Da geht noch mehr – nimm Dir die Fehler-Liste und den Spickzettel vor.'};
  if(p>=30)return {g:5,l:'mangelhaft',c:'Kein Stress – dafür übst Du ja. Geh die Themen einzeln durch.'};
  return {g:6,l:'ungenügend',c:'Lies zuerst den Spickzettel und starte dann mit Thema 1.'};
}
function renderExamStart(){
  const hist=S.exams.slice(-5);
  $('#v-exam').innerHTML=`<div class="gcard examhead">
    <div class="ei">${ico('clock')}</div>
    <h2>Probe-Schulaufgabe</h2>
    <p>16 Grammatik-Aufgaben (je 4 pro Thema) und 8 Vokabeln – wie in der echten Schulaufgabe ohne Sofort-Feedback. Am Ende bekommst Du eine Note und siehst, was noch wackelt.</p>
    <div class="rules"><div><b>24</b><small>Aufgaben</small></div><div><b>20</b><small>Minuten</small></div><div><b>1–6</b><small>Note</small></div></div>
    <div class="actions" style="border:0;padding:0;max-width:520px;margin:0 auto;flex-wrap:wrap">
      <button class="btn" id="eTimed">${ico('clock')} Mit Timer starten</button>
      <button class="btn ghost" id="eFree">Ohne Zeitlimit</button>
    </div>
    ${hist.length?`<p class="note" style="margin-top:18px">Deine letzten Probe-Noten: ${hist.map(h=>`<b>${h.grade}</b>`).join(' · ')}</p>`:''}
  </div>`;
  $('#eTimed').onclick=()=>startExam(true);$('#eFree').onclick=()=>startExam(false);
}
function startExam(timed){
  const qs=[];
  for(const t of TOPICS){
    const pool=shuffle(Q.filter(q=>q.t===t.id&&q.type!=='order'));
    const gaps=pool.filter(q=>q.type!=='mc'),mcs=pool.filter(q=>q.type==='mc');
    qs.push(...shuffle([...gaps.slice(0,3),...mcs.slice(0,1)]).slice(0,4));
  }
  pickVocab(V,8).forEach(v=>qs.push({id:'X'+v.id,t:'vocab',type:'vocab',v,i:'Übersetze ins Englische.',s:v.de[0],ex:esc(v.tip)}));
  Object.assign(EX,{running:true,qs,ans:{},timed,left:1200});
  clearInterval(EX.timer);
  if(timed)EX.timer=setInterval(()=>{EX.left--;paintTimer();if(EX.left<=0){clearInterval(EX.timer);toast('Zeit ist um!');submitExam()}},1000);
  renderExamRun();
}
function stopExam(){clearInterval(EX.timer);EX.running=false}
function answeredCount(){return EX.qs.filter(q=>{const a=EX.ans[q.id];return Array.isArray(a)?a.some(x=>x&&x.trim()):a&&String(a).trim()}).length}
function paintTimer(){
  const el=$('#eTimer');if(!el)return;
  const m=Math.floor(EX.left/60),s=EX.left%60;
  el.innerHTML=`${ico('clock')} ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('low',EX.left<120);
}
function paintCount(){const el=$('#eCount');if(el)el.textContent=`${answeredCount()} / ${EX.qs.length} bearbeitet`;
  EX.qs.forEach(q=>{const c=document.querySelector(`.eq[data-q="${q.id}"]`);const a=EX.ans[q.id];if(c)c.classList.toggle('done',Array.isArray(a)?a.some(x=>x&&x.trim()):!!(a&&String(a).trim()))})}
function renderExamRun(){
  const v=$('#v-exam');
  let html=`<div class="ebar">${EX.timed?'<div class="timer" id="eTimer"></div>':''}<div style="flex:1;font-weight:700;font-size:14px" id="eCount"></div><button class="btn auto" id="eSubmit" style="height:44px;font-size:15px">Abgeben</button></div>`;
  EX.qs.forEach((q,n)=>{
    const t=T(q.t);
    let body='';
    if(q.type==='gap'){let k=0;body=`<div class="sentence">${esc(q.s).replace(/___/g,()=>{const sz=(q.sz&&q.sz[k])||'';return `<input class="blank ${sz}" data-q="${q.id}" data-k="${k++}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`})}</div>`}
    else if(q.type==='write'||q.type==='vocab'){body=`<div class="sentence">${esc(q.s)}</div><input class="inp" data-q="${q.id}" data-k="0" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Auf Englisch …">`}
    else{body=(q.s?`<div class="sentence">${esc(q.s)}</div>`:'')+`<div class="opts ${q.two?'two':''}">${shuffle(q.o).map(o=>`<button class="opt" data-q="${q.id}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
    html+=`<div class="eq" data-q="${q.id}" style="--mc:${t.color}"><div class="n"><span>Aufgabe ${n+1}</span><span>${t.name}</span></div><p class="instr">${esc(q.i)}</p>${body}</div>`;
  });
  html+=`<button class="btn" id="eSubmit2" style="margin-top:6px">Schulaufgabe abgeben</button>`;
  v.innerHTML=html;
  v.querySelectorAll('input[data-q]').forEach(el=>el.addEventListener('input',()=>{
    const q=EX.qs.find(x=>x.id===el.dataset.q);
    if(q.type==='gap'&&q.a.length>1){const a=EX.ans[q.id]||[];a[+el.dataset.k]=el.value;EX.ans[q.id]=a}else EX.ans[q.id]=el.value;
    paintCount();
  }));
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    EX.ans[b.dataset.q]=b.dataset.o;
    v.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.toggle('sel',x===b));paintCount();
  });
  const sub=()=>{const open=EX.qs.length-answeredCount();
    if(open>0)confirmDlg('Wirklich abgeben?',`${open} ${open===1?'Aufgabe ist':'Aufgaben sind'} noch leer. Leere Aufgaben zählen als falsch.`,'Abgeben',submitExam,'Weiterschreiben');
    else confirmDlg('Schulaufgabe abgeben?','Danach siehst Du Deine Note und die Korrektur.','Abgeben',submitExam,'Nochmal prüfen')};
  $('#eSubmit').onclick=sub;$('#eSubmit2').onclick=sub;
  paintTimer();paintCount();window.scrollTo({top:0});
}
function submitExam(){
  stopExam();
  const res=EX.qs.map(q=>{const a=EX.ans[q.id]||(q.type==='gap'&&q.a.length>1?[]:'');const r=evaluate(q,a);return {q,a,ok:r.r==='ok',near:r.r==='near',trap:r.m&&r.r==='trap'?r.m:''}});
  let correct=0;
  res.forEach(x=>{
    if(x.ok)correct++;
    if(x.q.type==='vocab'){vUpdate(x.q.v.id,x.ok,false);return}
    if(x.ok){if(!S.mastered.includes(x.q.id))S.mastered.push(x.q.id);S.missed=S.missed.filter(i=>i!==x.q.id)}
    else if(!S.missed.includes(x.q.id))S.missed.push(x.q.id);
  });
  const p=Math.round(correct/res.length*100),gr=grade(p);
  S.xp+=correct*10;S.exams.push({date:Date.now(),grade:gr.g,p});save();updateHeader();
  const per=[...TOPICS,VT].map(t=>{const r=res.filter(x=>x.q.t===t.id);return {t,ok:r.filter(x=>x.ok).length,n:r.length}});
  const weak=per.filter(x=>x.ok<x.n).sort((a,b)=>a.ok/a.n-b.ok/b.n)[0];
  const showAns=x=>{const a=Array.isArray(x.a)?x.a.filter(Boolean).join(' … '):x.a;return a&&String(a).trim()?esc(a):'<i>(leer)</i>'};
  $('#v-exam').innerHTML=`<div class="gcard sum">
    <p class="eyebrow">Dein Ergebnis</p>
    <div class="grade">${gr.g}</div>
    <h2 style="font-size:22px">${gr.l} · ${correct} von ${res.length} Punkten (${p}%)</h2>
    <p class="sub">${gr.c}</p>
    <div class="tbreak">${per.map(x=>`<div class="tb" style="--mc:${x.t.color}"><div class="row"><span>${x.t.name}</span><span>${x.ok}/${x.n}</span></div><div class="bar"><i style="width:${x.ok/x.n*100}%"></i></div></div>`).join('')}</div>
    <div class="sumbtns">
      ${weak?`<button class="btn" style="--mc:${weak.t.color}" data-practice="${weak.t.id}">${ico('target')} ${weak.t.name} üben</button>`:''}
      ${S.missed.length+weakVocab().length?`<button class="btn rose" id="xRev">Fehler üben (${S.missed.length+weakVocab().length})</button>`:''}
      <button class="btn ghost" id="xNew">${ico('rotate')} Neue Probe-SA</button>
    </div>
    <p class="note">Der Notenschlüssel ist ein Richtwert – Deine Lehrkraft kann anders bewerten.</p>
  </div>
  <div class="sec-title">Korrektur</div>
  ${res.map((x,n)=>`<div class="corr ${x.ok?'ok':'bad'}"><div class="q">${n+1}. ${esc(x.q.type==='vocab'?'Übersetze: '+x.q.s:(x.q.s||x.q.i))}</div>
    <div class="you">${x.ok?ico('check'):ico('x')} Deine Antwort: <b>${showAns(x)}</b>${x.near?' <span class="muted">(knapp daneben – Schreibweise!)</span>':''}</div>
    ${x.ok?'':`<div class="you">Richtig: <b>${esc(x.q.type==='gap'?fullSentence(x.q):solutionText(x.q))}</b></div>`}
    ${x.ok?'':`<div class="ex">${x.trap?x.trap+' ':''}${x.q.ex}</div>`}</div>`).join('')}`;
  paintIcons($('#v-exam'));
  if($('#xRev'))$('#xRev').onclick=()=>go('review');
  $('#xNew').onclick=renderExamStart;
  window.scrollTo({top:0});
}

/* =========================================================================
   INIT
   ========================================================================= */
paintIcons();
go('home');
</script>
